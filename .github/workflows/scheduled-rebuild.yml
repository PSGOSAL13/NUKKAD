# Optional: trigger a fresh deploy every morning so the static copy of the
# menu/events (what search engines see) follows the Google Sheet.
# Set the repository secret CF_DEPLOY_HOOK_URL (Cloudflare Pages → Settings →
# Builds → Deploy hooks). Without the secret this workflow does nothing.
name: Scheduled rebuild
on:
  schedule:
    - cron: "30 0 * * *" # 06:00 IST
  workflow_dispatch:
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deploy hook
        env:
          HOOK: ${{ secrets.CF_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then echo "CF_DEPLOY_HOOK_URL not set — skipping"; exit 0; fi
          curl -fsS -X POST "$HOOK"
